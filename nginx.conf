server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Stage site: a copy of flutterflow.io, must not be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # No 404.html exists in dist (the source archive had no 404 page),
    # so nginx falls back to its built-in 404 if this file is missing.
    error_page 404 /404.html;

    location ~* \.(?:css|js|jpg|jpeg|png|gif|svg|webp|avif|ico|woff2?|mp4|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
